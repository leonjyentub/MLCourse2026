[project]
name = "mlcourse2026"
version = "0.1.0"
description = "三週碩士班機器學習概念與評估：可重現教學實驗"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.3.3",
  "pandas==2.3.3",
  "scipy==1.16.2",
  "scikit-learn==1.7.2",
  "matplotlib==3.10.6",
  "seaborn==0.13.2",
  "joblib>=1.5.2,<2",
  "cloudpickle>=3,<4",
  "jupyterlab>=4.4.9,<5",
  "ipykernel>=6.30.1,<7",
  "ipywidgets>=8.1.7,<9",
  "nbformat>=5.10.4,<6",
  "nbclient>=0.10.2,<0.11",
  "nbconvert>=7.16.6,<8",
  "pillow>=11.3,<12",
]
[dependency-groups]
dev = ["pytest>=8.4,<9"]
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/mlcourse"]
[tool.pytest.ini_options]
testpaths = ["tests"]
