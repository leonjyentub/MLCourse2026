none"/><text x="920" y="229" font-size="25" fill="#153e56" text-anchor="middle" font-weight="normal">學到的模型</text><text x="720" y="310" font-size="24" fill="#153e56" text-anchor="middle" font-weight="normal">學到的模型再接收新資料，產生預測</text></g></svg>