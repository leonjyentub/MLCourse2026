<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img"><title>強化學習的代理人與環境互動；依主教材圖1-12改繪</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#687a86"/></marker></defs><g font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="80" y="65" width="260" height="100" rx="5" fill="#e6f0ed" stroke="none"/><text x="210" y="125" font-size="29" fill="#153e56" text-anchor="middle" font-weight="normal">代理人／策略</text><rect x="660" y="65" width="260" height="100" rx="5" fill="#e6f0ed" stroke="none"/><text x="790" y="125" font-size="29" fill="#153e56" text-anchor="middle" font-weight="normal">環境</text><line x1="350" y1="90" x2="650" y2="90" stroke="#687a86" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="64" font-size="24" fill="#153e56" text-anchor="middle" font-weight="normal">行動</text><line x1="650" y1="145" x2="350" y2="145" stroke="#687a86" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="187" font-size="24" fill="#153e56" text-anchor="middle" font-weight="normal">新狀態 + 獎勵</text><text x="500" y="245" font-size="23" fill="#687a86" text-anchor="middle" font-weight="normal">互動產生學習資料，策略影響後續取得的經驗</text></g></svg>